# Builds the Vulkan layer and its test scene on Linux, and runs native/check.sh on Mesa's software Vulkan driver
# (lavapipe) under the Khronos validation layer.
name: native

on:
  push:
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan headers, loader, lavapipe, validation layer and glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ zlib1g-dev python3 \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers glslang-tools vulkan-tools
      - name: Show the Vulkan devices
        run: vulkaninfo --summary
      - name: Build
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release && cmake --build native/build -j
      - name: Run the test scene alone
        timeout-minutes: 5
        run: native/build/fh_scene --frames 20
      - name: Run it with the layer capturing
        timeout-minutes: 5
        run: |
          VK_ADD_LAYER_PATH=native/build VK_INSTANCE_LAYERS=VK_LAYER_FRAMEHOUND_glitch FRAMEHOUND_OUT=out \
            FRAMEHOUND_START=5 FRAMEHOUND_EVERY=5 FRAMEHOUND_CAPTURES=2 native/build/fh_scene --frames 20
          wc -l out/manifest.jsonl
      - name: Capture in every mode, under the validation layer
        timeout-minutes: 20
        run: native/check.sh native/build
