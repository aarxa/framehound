; framehound: added to Godot's TPS demo folder with framehound_driver.gd. Godot reads override.cfg after
; project.godot, so these settings and the driver apply without changing the demo's own files.

[autoload]

FramehoundDriver="*res://framehound_driver.gd"

[display]

window/size/fullscreen=false
window/size/mode=0
window/size/window_width_override=768
window/size/window_height_override=432
window/size/resizable=false
window/size/no_focus=true
window/dpi/allow_hidpi=false
window/vsync/vsync_mode=0
window/hdr/request_hdr_output=false

[rendering]

rendering_device/driver.macos="vulkan"
